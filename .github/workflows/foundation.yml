name: Foundation checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    name: PHP lint, bootstrap and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify repository foundation
        run: sh scripts/verify.sh
