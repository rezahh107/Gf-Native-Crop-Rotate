name: Foundation checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    name: PHP lint, bootstrap and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify repository foundation
        run: sh scripts/verify.sh
